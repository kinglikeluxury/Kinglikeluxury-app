name: Build and push KAY RunPod voice worker

on:
  workflow_dispatch:
  push:
    branches:
      - kay-voice-runpod-build
    paths:
      - external/kay-voice-service/**
      - .github/workflows/build-kay-voice-runpod.yml

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable SHA image
        uses: docker/build-push-action@v6
        with:
          context: external/kay-voice-service
          file: external/kay-voice-service/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kay-voice-tts:${{ github.sha }}
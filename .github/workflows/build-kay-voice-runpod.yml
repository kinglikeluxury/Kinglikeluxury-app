name: Build and push KAY RunPod voice worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kay-voice-runpod.yml"
      - "external/kay-voice-service/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

      - name: Build and push immutable SHA image
        uses: docker/build-push-action@v6
        with:
          context: external/kay-voice-service
          file: external/kay-voice-service/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kinglikeluxury/kay-voice-tts:${{ github.sha }}
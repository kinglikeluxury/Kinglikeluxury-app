name: WhatsApp dedicated Staging database routing (synthetic)

on:
  push:
    paths:
      - "server/whatsappStagingProofDb.ts"
      - "server/whatsappStagingProofDb.test.ts"
      - "server/whatsappStagingOnboardingRoutes.ts"
      - "server/whatsappStagingOnboardingRoutes.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-proof-db.yml"
  pull_request:
    paths:
      - "server/whatsappStagingProofDb.ts"
      - "server/whatsappStagingProofDb.test.ts"
      - "server/whatsappStagingOnboardingRoutes.ts"
      - "server/whatsappStagingOnboardingRoutes.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-proof-db.yml"

permissions:
  contents: read

jobs:
  isolated-proof-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test dedicated DB gate and existing signup protections
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
          WHATSAPP_STAGING_GRAPH_PILOT_OWNER_APPROVED: "false"
        run: node --import tsx --test server/whatsappStagingProofDb.test.ts server/whatsappStagingOnboardingRoutes.test.ts server/whatsappStagingMetaVerifier.test.ts
      - name: Build without live Meta or staff data
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
        run: npm run build

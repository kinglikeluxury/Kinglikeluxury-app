name: WhatsApp Staging synthetic proof end-to-end (rollback only)

on:
  push:
    paths:
      - "server/whatsappStagingSyntheticProofE2E.ts"
      - "server/whatsappStagingSyntheticProofE2E.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-synthetic-e2e.yml"
  pull_request:
    paths:
      - "server/whatsappStagingSyntheticProofE2E.ts"
      - "server/whatsappStagingSyntheticProofE2E.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-synthetic-e2e.yml"

permissions:
  contents: read

jobs:
  synthetic-staging-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic full proof test and isolation unit tests
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
          WHATSAPP_STAGING_GRAPH_PILOT_OWNER_APPROVED: "false"
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
        run: node --import tsx --test server/whatsappStagingSyntheticProofE2E.test.ts server/whatsappStagingProofDb.test.ts server/whatsappStagingOnboardingRoutes.test.ts
      - name: Full application build, without provider credentials
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
        run: npm run build

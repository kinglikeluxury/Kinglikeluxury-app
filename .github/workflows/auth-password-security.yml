name: Auth password persistence regression

on:
  push:
    paths:
      - "server/passwordSecurity.ts"
      - "server/passwordSecurity.test.ts"
      - "server/routes.ts"
      - ".github/workflows/auth-password-security.yml"
  pull_request:
    paths:
      - "server/passwordSecurity.ts"
      - "server/passwordSecurity.test.ts"
      - "server/routes.ts"
      - ".github/workflows/auth-password-security.yml"

permissions:
  contents: read

jobs:
  password-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Password verification regression (synthetic only)
        run: node --import tsx --test server/passwordSecurity.test.ts
      - name: Production-equivalent TypeScript build without deployment
        env:
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
        run: npm run build

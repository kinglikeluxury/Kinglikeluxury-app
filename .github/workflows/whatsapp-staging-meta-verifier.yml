name: WhatsApp company-only Meta Graph verifier (synthetic, fail closed)

on:
  push:
    paths:
      - "server/whatsappMetaGraphVerifier.ts"
      - "server/whatsappStagingMetaVerifier.ts"
      - "server/whatsappStagingMetaVerifier.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-meta-verifier.yml"
  pull_request:
    paths:
      - "server/whatsappMetaGraphVerifier.ts"
      - "server/whatsappStagingMetaVerifier.ts"
      - "server/whatsappStagingMetaVerifier.test.ts"
      - "server/index.ts"
      - ".github/workflows/whatsapp-staging-meta-verifier.yml"

permissions:
  contents: read

jobs:
  synthetic-meta-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Meta proof checks and Staging isolation
        env:
          APP_DEPLOYMENT_MODE: staging
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
          WHATSAPP_STAGING_GRAPH_PILOT_OWNER_APPROVED: "false"
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
        run: node --import tsx --test server/whatsappStagingMetaVerifier.test.ts server/whatsappMetaGraphVerifier.test.ts server/whatsappStagingOnboardingRoutes.test.ts
      - name: Build without credentials or provider calls
        env:
          APP_DEPLOYMENT_MODE: staging
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
          WHATSAPP_STAGING_GRAPH_PILOT_OWNER_APPROVED: "false"
        run: npm run build

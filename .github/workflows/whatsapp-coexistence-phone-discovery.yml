name: WhatsApp Coexistence missing phone ID recovery (synthetic)

on:
  push:
    paths:
      - "client/src/lib/metaSignupCompletionBridge.ts"
      - "server/metaSignupCompletionBridge.test.ts"
      - "server/whatsappMetaOnboardingProof.ts"
      - "server/whatsappMetaOnboardingProof.test.ts"
      - "server/whatsappMetaGraphVerifier.ts"
      - "server/whatsappMetaGraphVerifier.test.ts"
      - "server/whatsappStagingOnboardingRoutes.ts"
      - "server/whatsappStagingOnboardingRoutes.test.ts"
      - ".github/workflows/whatsapp-coexistence-phone-discovery.yml"
  pull_request:
    paths:
      - "client/src/lib/metaSignupCompletionBridge.ts"
      - "server/metaSignupCompletionBridge.test.ts"
      - "server/whatsappMetaOnboardingProof.ts"
      - "server/whatsappMetaOnboardingProof.test.ts"
      - "server/whatsappMetaGraphVerifier.ts"
      - "server/whatsappMetaGraphVerifier.test.ts"
      - "server/whatsappStagingOnboardingRoutes.ts"
      - "server/whatsappStagingOnboardingRoutes.test.ts"
      - ".github/workflows/whatsapp-coexistence-phone-discovery.yml"

permissions:
  contents: read

jobs:
  synthetic-phone-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fail-closed Meta source-of-truth discovery
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
          WHATSAPP_STAGING_VERIFIED_SIGNUP_ENABLED: "false"
        run: node --import tsx --test server/metaSignupCompletionBridge.test.ts server/whatsappMetaOnboardingProof.test.ts server/whatsappMetaGraphVerifier.test.ts
      - name: Verify Staging-only HTTP and policy checks
        env:
          APP_DEPLOYMENT_MODE: staging
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
          WHATSAPP_STAGING_META_GRAPH_VERIFIER_ENABLED: "false"
        run: node --import tsx --test server/whatsappStagingOnboardingRoutes.test.ts server/whatsappStagingMetaVerifier.test.ts
      - name: Build without Meta API calls
        env:
          APP_DEPLOYMENT_MODE: ci-test-disabled
          WHATSAPP_EMPLOYEE_MONITORING_ENABLED: "false"
        run: npm run build

name: Auth password storage safety (review only)
on:
  push:
    branches:
      - security/auth-password-hash-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing authentication and password safety tests
        run: npx tsx --test server/authPasswordRecoveryRoutes.test.ts server/authChangePasswordRoute.test.ts server/authLoginRoute.test.ts server/authRegisterRoute.test.ts
      - name: TypeScript regression check (new auth files and changed routes lines; legacy errors excluded)
        shell: bash
        run: |
          npm run check > auth-typecheck.log 2>&1 || true
          if grep -E '^(server/authChangePasswordRoute|server/authPasswordRecoveryRoutes).*error TS|^server/routes.ts\((44|1386),.*error TS' auth-typecheck.log; then
            echo "TypeScript errors in changed authentication files"
            exit 1
          fi
      - name: Build application (no deployment)
        run: npm run build
